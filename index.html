<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#EFE8DC" />
    <title>Nonograms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <p class="brand-kicker">Picture crossword</p>
          <h1 class="brand-title">Nonograms</h1>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch theme">
            <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6" />
              <path
                d="M12 3v1.6M12 19.4V21M4.6 4.6l1.1 1.1M18.3 18.3l1.1 1.1M3 12h1.6M19.4 12H21M4.6 19.4l1.1-1.1M18.3 5.7l1.1-1.1"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
              />
            </svg>
            <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M16.2 13.2A6.2 6.2 0 0 1 10.8 4.6 7 7 0 1 0 19.4 13.2a6.2 6.2 0 0 1-3.2 0z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" aria-label="Mute sound">
            <svg class="icon icon-sound-on" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M4 10v4h3l5 4V6L7 10H4z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linejoin="round"
              />
              <path
                d="M16 9.2a4 4 0 0 1 0 5.6M18.4 7a7 7 0 0 1 0 10"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
              />
            </svg>
            <svg class="icon icon-sound-off" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M4 10v4h3l5 4V6L7 10H4z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linejoin="round"
              />
              <path
                d="M17 10l4 4M21 10l-4 4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
      </header>

      <div class="layout">
        <aside class="sidebar">
          <div class="segmented" role="tablist" aria-label="Difficulty">
            <button class="segmented-btn is-active" data-difficulty="easy" type="button">Easy</button>
            <button class="segmented-btn" data-difficulty="medium" type="button">Medium</button>
            <button class="segmented-btn" data-difficulty="hard" type="button">Hard</button>
          </div>
          <nav class="puzzle-nav" id="puzzle-nav" aria-label="Puzzles"></nav>
        </aside>

        <main class="stage">
          <div class="stage-meta">
            <div>
              <h2 class="puzzle-name" id="puzzle-name">Turtle</h2>
              <p class="puzzle-meta" id="puzzle-meta">Easy · 5×5</p>
            </div>
            <div class="timer" id="timer" aria-live="polite">00:00</div>
          </div>

          <div class="sheet">
            <div class="tool-row">
              <div class="segmented segmented-sm" role="group" aria-label="Drawing tool">
                <button class="segmented-btn is-active" data-tool="fill" type="button">Fill</button>
                <button class="segmented-btn" data-tool="mark" type="button">Mark</button>
              </div>
              <p class="hint" id="input-hint">Left click fills · right click marks · drag to paint</p>
            </div>

            <div class="board-scroll">
              <div
                class="board"
                id="board"
                role="grid"
                aria-label="Nonogram grid"
              ></div>
            </div>

            <p class="win-banner" id="win-banner" hidden></p>
          </div>

          <div class="actions">
            <button class="btn" id="reset-btn" type="button">Reset</button>
            <button class="btn" id="save-btn" type="button">Save</button>
            <button class="btn" id="continue-btn" type="button" hidden>Continue</button>
            <button class="btn" id="random-btn" type="button">Random</button>
            <button class="btn" id="solve-btn" type="button">Solve</button>
            <button class="btn" id="scores-btn" type="button">Scores</button>
          </div>
        </main>
      </div>
    </div>

    <dialog class="scores" id="scores-dialog" aria-labelledby="scores-title">
      <div class="scores-head">
        <h2 id="scores-title">Recent solves</h2>
        <button class="icon-btn" id="scores-close" type="button" aria-label="Close">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M7 7l10 10M17 7L7 17"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>
      <div class="scores-body" id="scores-body"></div>
    </dialog>

    <script src="puzzles.js"></script>
    <script src="app.js"></script>
  </body>
</html>
